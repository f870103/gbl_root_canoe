name: Temporary chained-vbmeta branch CI
on:
  push:
    branches:
      - fix/chained-boot-vbmeta-profile
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.0
      - run: cargo test --locked --manifest-path tools/mode2-profile/Cargo.toml
      - run: cargo test --locked --manifest-path tools/canoe-image/Cargo.toml
